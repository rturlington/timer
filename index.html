<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tolliver's Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    main {
      position: relative; z-index: 1;
      max-width: 560px; margin: 0 auto;
      padding: 20px 16px 120px;
      display: flex; flex-direction: column; gap: 18px; align-items: stretch;
    }
    .title { font-size: clamp(2.4rem, 10vw, 3.6rem); margin-top: 6px; }
    .card {
      background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
      padding: 18px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.2rem; text-align: center; }
    .preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .preview .face-wrap { width: min(260px, 70vw); }
    .preview .digits { font-size: 2.6rem; box-shadow: none; background: #eef7ff; }
    .preview .message { font-size: 1.1rem; }

    button {
      font-family: inherit; font-weight: 600; color: var(--ink);
      border: 0; border-radius: 20px; cursor: pointer;
      box-shadow: 0 5px 0 rgba(45, 42, 90, 0.25);
      transition: transform 0.08s, box-shadow 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(45, 42, 90, 0.25); }
    button:focus-visible { outline: 4px solid var(--purple); outline-offset: 3px; }

    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .presets button { padding: 12px 4px; font-size: 1.15rem; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .presets button .e { font-size: 1.8rem; }
    .presets button.sel { outline: 4px solid var(--ink); outline-offset: -4px; }

    .custom { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
    .custom button { width: 56px; height: 56px; font-size: 1.8rem; background: var(--yellow); border-radius: 50%; }
    .custom .val { font-size: 1.6rem; font-weight: 700; min-width: 110px; text-align: center; }

    .buddies { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .buddies button { font-size: 2rem; width: 58px; height: 58px; background: #eef7ff; border-radius: 50%; padding: 0; }
    .buddies button.sel { background: var(--yellow); }

    .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .controls button { padding: 18px 8px; font-size: 1.5rem; }
    #startBtn { background: var(--green); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
    #startBtn.pause { background: var(--orange); }
    #resetBtn { background: #ffd1dc; }

    .cast { display: grid; gap: 10px; }
    #castBtn { background: var(--blue); color: #fff; padding: 16px; font-size: 1.35rem; text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
    #castBtn.on { background: var(--purple); }
    #bigBtn { background: #eef7ff; padding: 12px; font-size: 1.05rem; }
    .hint { font-size: 0.95rem; text-align: center; margin: 0; opacity: 0.8; line-height: 1.4; }

    input.label {
      width: 100%; font-family: inherit; font-size: 1.15rem; padding: 12px 16px;
      border-radius: 18px; border: 3px solid #d7ecff; color: var(--ink); text-align: center;
    }
    input.label:focus { outline: none; border-color: var(--blue); }
  </style>
</head>
<body>
  <div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
  <div class="grass"></div>

  <main>
    <h1 class="title" id="title">Tolliver's Timer</h1>

    <section class="card preview">
      <div class="face-wrap" id="face"></div>
      <div class="digits" id="digits">5:00</div>
      <div class="message" id="message"></div>
    </section>

    <section class="controls">
      <button id="startBtn">▶️ Go!</button>
      <button id="resetBtn">🔄 Reset</button>
    </section>

    <section class="card">
      <h2>⏰ How long?</h2>
      <div class="presets" id="presets"></div>
      <div class="custom">
        <button id="minus" aria-label="One minute less">−</button>
        <div class="val" id="customVal">5 min</div>
        <button id="plus" aria-label="One minute more">+</button>
      </div>
    </section>

    <section class="card">
      <h2>🐾 Pick a buddy</h2>
      <div class="buddies" id="buddies"></div>
    </section>

    <section class="card">
      <h2>✏️ What are we doing?</h2>
      <input class="label" id="label" maxlength="40" placeholder="Brush teeth, clean up toys…">
    </section>

    <section class="card cast">
      <h2>📺 Show it on the TV</h2>
      <button id="castBtn">📡 Cast to TV</button>
      <button id="bigBtn">🖥️ Open big-screen window</button>
      <p class="hint" id="castHint"></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/face.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
